server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: learning-assistant

  main:
    allow-bean-definition-overriding: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: ${OLLAMA_TEMPERATURE:0.7}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}
    vectorstore:
      pgvector:
        dimensions: 768
        distance-type: COSINE_DISTANCE

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learning_assistant_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: LearningAssistantHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

rag:
  chunk-size: ${RAG_CHUNK_SIZE:800}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
  min-chunk-size: ${RAG_MIN_CHUNK_SIZE:20}
  top-k: ${RAG_TOP_K:4}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: 900000       # 15 Minutes
  refresh-token-expiration-ms: 604800000   # 7 Days

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/}
  max-size-bytes: 20971520 # 20 MB
